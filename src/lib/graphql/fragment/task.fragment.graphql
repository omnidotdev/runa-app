fragment Task on Task {
  rowId
  number
  columnId
  columnIndex
  content
  description
  priority
  dueDate
  taskLabels {
    nodes {
      label {
        ...Label
      }
    }
  }
  assignees {
    nodes {
      taskId
      userId
      user {
        rowId
        identityProviderId
        name
        avatarUrl
      }
    }
  }
  posts {
    totalCount
  }
  attachments {
    totalCount
  }
  checklists {
    nodes {
      rowId
      checklistItems {
        totalCount
      }
      doneItems: checklistItems(filter: { isDone: { equalTo: true } }) {
        totalCount
      }
    }
  }
}
